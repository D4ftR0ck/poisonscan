[package]
name = "poisonscan-cli"
description = "Command-line interface for poisonscan"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "poisonscan"
path = "src/main.rs"

[dependencies]
poisonscan-core = { path = "../poisonscan-core" }
poisonscan-sources = { path = "../poisonscan-sources" }
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
rayon = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
toml = "1.2.2"
sha2 = "0.11.1"
serde = { workspace = true, features = ["derive"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
