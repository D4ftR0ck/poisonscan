[workspace]
resolver = "2"
members = ["crates/poisonscan-core", "crates/poisonscan-sources", "crates/poisonscan-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
